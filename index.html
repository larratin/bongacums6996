<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>larratin.com</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1d4747 0%, #0f202a 50%, #1d4747 100%);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .btn {
      /* Очень большие внутренние отступы — кнопка становится крупной */
      padding: 36px 72px;

      /* Крупный жирный шрифт */
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;

      border: none;
      border-radius: 40px; /* скругление под размер кнопки */
      cursor: pointer;
      position: relative;
      overflow: hidden;

      /* Объёмная тень — выглядит «тяжелее» и дороже */
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);

      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      background: linear-gradient(135deg, #ff0000 0%, #682626 100%);
      text-align: center;
      white-space: nowrap;
    }

    .btn:hover {
      transform: scale(1.1); /* сильное увеличение при наведении */
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
      background: linear-gradient(135deg, #e51e1e 0%, #5a1f1f 100%);
    }

    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* Лёгкий эффект объёма у текста */
    .btn b {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <button class="btn" id="ytBtn">
    <b>for goon ppl only</b>
  </button>

  <script>
    const channelUrl = 'https://youtu.be/6ogrMnez0Os';

    document.getElementById('ytBtn').addEventListener('click', () => {
      window.location.href = channelUrl;
    });
  </script>
</body>
</html>
